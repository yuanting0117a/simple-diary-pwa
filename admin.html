<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">\n<link rel="icon" href="./icons/admin-icon.svg" type="image/svg+xml">\n<link rel="manifest" href="./admin.webmanifest">\n<meta name="theme-color" content="#172b4d">
<title>簡潔記事｜通知管理</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{margin:0;padding:20px;background:#f5f6fa;color:#252936}
main{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:8px 0 18px;display:flex;align-items:center;gap:10px}h1 img{width:34px;height:34px;flex:none}
.panel{background:#fff;border:1px solid #e4e6ed;border-radius:14px;padding:16px;margin:12px 0}
input,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #d8dbe5}
input{width:100%;box-sizing:border-box;margin:6px 0 10px}
button{background:#4778e8;color:white;border:0;cursor:pointer}
button.secondary{background:#e9edf7;color:#30394b}
.muted{color:#747b8c;font-size:13px}
.device{font-weight:700;margin:0;cursor:pointer;list-style:none}.device::-webkit-details-marker{display:none}.device-wrap[open] .device:after{content:"－"}.device:after{content:"＋";float:right;color:#7b8497}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar label{font-size:13px;color:#747b8c}.toolbar select{font:inherit;border:1px solid #d8dbe5;border-radius:9px;padding:8px 10px;background:white;color:#30394b}.device-content{margin-top:10px}
.item{border-top:1px solid #eceef3;padding:12px 0}
.item:first-child{border-top:0}
.item h3{font-size:16px;margin:0 0 5px}
.item p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}
.status{font-size:12px;border-radius:20px;padding:3px 8px;background:#edf1fa;color:#53617d}
.status.sent{background:#e6f5eb;color:#267342}
#message{margin:10px 0;color:#b04444}
@media(prefers-color-scheme:dark){body{background:#171a22;color:#eee}.panel{background:#222631;border-color:#343a48}input{background:#171a22;color:#eee;border-color:#454c5c}.item{border-color:#343a48}.muted{color:#aab1c0}.status{background:#343b4b;color:#d5def2}.status.sent{background:#244631;color:#a9e5bd}}
</style>
</head>
<body>
<main>
<h1><img src="./icons/admin-icon.svg" alt="">簡潔記事｜通知管理</h1>
<section class="panel">
<label for="password">管理者密碼</label>
<input id="password" type="password" autocomplete="current-password" placeholder="輸入 Cloudflare ADMIN_PASSWORD">
<button id="load">查看通知</button>
<button id="refresh" class="secondary" hidden>重新整理</button>
<div id="message" role="status"></div>
<p class="muted">此頁只讀取雲端通知資料，不會修改或刪除使用者資料。</p>
</section>
<section id="sortPanel" class="panel toolbar" hidden><label for="sort">通知排序</label><select id="sort"><option value="newest">時間：新到舊</option><option value="oldest">時間：舊到新</option><option value="pending">未送出優先</option><option value="sent">已送出優先</option></select></section>
<div id="summary"></div>
<div id="results"></div>
</main>
<script>
const API = "https://simple-diary-sync.yuanting0117a.workers.dev/api/admin/reminders";
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const results = document.getElementById("results");
const summary = document.getElementById("summary");
const loadButton = document.getElementById("load");
const refreshButton = document.getElementById("refresh");
const sortSelect = document.getElementById("sort");
const sortPanel = document.getElementById("sortPanel");
let latestData = null;
let adminPassword = "";
function dateText(value){
  if(!Number.isFinite(value)) return "未設定時間";
  return new Date(value).toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function el(tag,className,text){
  const node=document.createElement(tag);
  if(className) node.className=className;
  if(text!==undefined) node.textContent=text;
  return node;
}
function render(){
  if(!latestData) return;
  const data=latestData;
  const totalReminders=data.devices.reduce((sum,device)=>sum+device.reminders.length,0);
  summary.replaceChildren(el("section","panel","共 "+data.totalDevices+" 台裝置 · "+totalReminders+" 筆通知"));
  results.replaceChildren();
  const mode=sortSelect.value;
  for(const device of data.devices){
    const card=el("section","panel");
    const details=el("details","device-wrap");
    details.append(el("summary","device","裝置 "+device.device+" · "+(device.hasPush?"通知已啟用":"目前未啟用通知")+" · "+device.reminders.length+" 筆"));
    const content=el("div","device-content");
    if(!device.reminders.length) content.append(el("p","muted","目前沒有同步的通知"));
    const reminders=[...device.reminders].sort((a,b)=>{
      const at=Number.isFinite(a.reminderAt)?a.reminderAt:0;
      const bt=Number.isFinite(b.reminderAt)?b.reminderAt:0;
      if(mode==="oldest") return at-bt;
      if(mode==="pending") return Number(!!a.sent)-Number(!!b.sent)||at-bt;
      if(mode==="sent") return Number(!!b.sent)-Number(!!a.sent)||bt-at;
      return bt-at;
    });
    for(const reminder of reminders){
      const item=el("div","item");
      item.append(el("h3","",reminder.title||"（沒有標題）"));
      item.append(el("p","",reminder.body||"（沒有內容）"));
      item.append(el("p","muted","通知時間："+dateText(reminder.reminderAt)));
      item.append(el("span","status"+(reminder.sent?" sent":""),reminder.sent?"已送出":"尚未送出"));
      content.append(item);
    }
    details.append(content); card.append(details); results.append(card);
  }
}
async function load(){
  adminPassword=passwordInput.value||adminPassword;
  if(!adminPassword){message.textContent="請先輸入管理者密碼。";return;}
  message.textContent="載入中…"; results.replaceChildren();
  try{
    const response=await fetch(API,{headers:{Authorization:"Bearer "+adminPassword}});
    const data=await response.json();
    if(!response.ok){if(response.status===401)adminPassword="";throw new Error(response.status===401?"密碼錯誤。":data.error||"讀取失敗");}
    latestData=data; render(); sortPanel.hidden=false; message.textContent="更新完成"; refreshButton.hidden=false;
  }catch(error){message.textContent=error.message;}
}
loadButton.addEventListener("click",load);
refreshButton.addEventListener("click",load);
sortSelect.addEventListener("change",render);
passwordInput.addEventListener("keydown",event=>{if(event.key==="Enter")load();});
</script>
</body>
</html>
