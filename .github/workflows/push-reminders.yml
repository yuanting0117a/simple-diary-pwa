name: Send diary push reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diary-push-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Firebase secrets
        id: config
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DB: ${{ secrets.FIREBASE_DATABASE_URL }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$SA" ] && [ -n "$DB" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase 尚未設定；略過推播。"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install google-auth
        if: steps.config.outputs.ready == 'true'
        run: pip install google-auth
      - name: Send due reminders
        if: steps.config.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: python scripts/send_push_reminders.py
